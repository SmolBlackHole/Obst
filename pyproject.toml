[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "obst"
version = "0.2.0"
description = "Open binary container for chunked data and reversible pipelines"
license = "MPL-2.0"
license-files = ["LICENSES/MPL-2.0.txt"]
requires-python = ">=3.14"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "hypothesis>=6.167.1",
    "isort>=9.0.1",
    "mypy>=1.14",
    "pyright>=1.1.411",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-timeout>=2.3",
    "reuse[charset-normalizer]>=6.2.0",
    "ruff>=0.16.6",
    "setuptools>=77",
    "vulture>=2.16",
]
security = ["pip-audit>=2.10.1"]

[project.scripts]
obst = "obst.cli.main:main"

[project.entry-points."obst.conformance"]
obst-format = "obst.format_conformance:obst_conformance"

[project.urls]
Documentation = "https://github.com/SmolBlackHole/Obst/blob/main/docs/README.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["obst*"]

[tool.setuptools.package-data]
obst = ["py.typed", "conformance/corpus/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "distribution: build and install one distribution in isolation",
    "timeout(seconds): maximum test duration",
]

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"scripts/documentation_graph.py" = ["S603"]
"scripts/quality.py" = ["S603"]
"tests/**/*.py" = ["S101"]
"tests/test_distribution_installation.py" = ["S603"]
"tests/test_documentation.py" = ["S102", "S603"]
"tests/test_package_boundaries.py" = ["S603"]

[tool.ruff.format]
quote-style = "double"

[tool.isort]
profile = "black"
line_length = 88
py_version = 314
src_paths = ["src", "tests", "scripts"]

[tool.vulture]
paths = ["src", "tests", "scripts"]
ignore_names = ["request"]
min_confidence = 100
sort_by_size = true

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = ["src"]
files = ["src/obst", "tests", "scripts"]
exclude = ["obst_lab"]

[tool.pyright]
include = ["src", "tests", "scripts"]
exclude = [
    "obst_lab",
    "build",
    "dist",
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
    ".venv",
]
extraPaths = ["src"]
pythonVersion = "3.14"
typeCheckingMode = "strict"

[tool.coverage.run]
source = ["obst"]
omit = ["*/tests/*", "*/venv/*", "*/.venv/*", "*/site-packages/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError",
]
