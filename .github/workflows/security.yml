name: Security

on:
    push:
    pull_request:
    workflow_dispatch:
    schedule:
        - cron: "23 4 * * 1"

permissions:
    contents: read

jobs:
    secrets:
        name: Secret scan
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Check out repository history
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  fetch-depth: 0

            - name: Scan with Gitleaks
              uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    dependencies:
        name: Python dependency audit
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Check out repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Set up Python
              uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
              with:
                  python-version: "3.14"
                  cache: pip
                  cache-dependency-path: |
                      pyproject.toml
                      plugins/defaults/pyproject.toml
                      examples/plugin_adaptive_zlib/pyproject.toml

            - name: Install audited environment
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install -e ".[security]" -e ./plugins/defaults -e ./examples/plugin_adaptive_zlib

            - name: Audit installed dependencies
              run: python -m pip_audit --local --skip-editable

    codeql:
        name: CodeQL
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
            security-events: write

        steps:
            - name: Check out repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Initialize CodeQL
              uses: github/codeql-action/init@fddeee1a7ece751b577e409a89057319e3172939 # v4
              with:
                  languages: python
                  queries: security-extended

            - name: Analyze
              uses: github/codeql-action/analyze@fddeee1a7ece751b577e409a89057319e3172939 # v4
