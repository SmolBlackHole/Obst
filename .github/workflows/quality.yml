name: Quality

on:
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    runtime:
        name: Runtime, Python 3.14 on ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]

        steps:
            - name: Check out repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Set up Python
              uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
              with:
                  python-version: "3.14"
                  cache: pip
                  cache-dependency-path: |
                      pyproject.toml
                      plugins/defaults/pyproject.toml
                      examples/plugin_adaptive_zlib/pyproject.toml

            - name: Install workspace development dependencies
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install -e ".[dev]" -e ./plugins/defaults -e ./examples/plugin_adaptive_zlib

            - name: Run workspace quality checks
              run: python scripts/quality.py

    defaults:
        name: Defaults plugin, Python 3.14 on ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]

        steps:
            - name: Check out repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Set up Python
              uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
              with:
                  python-version: "3.14"
                  cache: pip
                  cache-dependency-path: |
                      pyproject.toml
                      plugins/defaults/pyproject.toml

            - name: Install defaults development dependencies
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install -e . -e "./plugins/defaults[dev]"

            - name: Run defaults quality checks
              run: python scripts/quality.py
              working-directory: plugins/defaults

    adaptive:
        name: Adaptive example, Python 3.14 on ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]

        steps:
            - name: Check out repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Set up Python
              uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
              with:
                  python-version: "3.14"
                  cache: pip
                  cache-dependency-path: |
                      pyproject.toml
                      plugins/defaults/pyproject.toml
                      examples/plugin_adaptive_zlib/pyproject.toml

            - name: Install adaptive development dependencies
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install -e . -e ./plugins/defaults -e "./examples/plugin_adaptive_zlib[dev]"

            - name: Run adaptive quality checks
              run: python scripts/quality.py
              working-directory: examples/plugin_adaptive_zlib

    packaging:
        name: Distribution packaging
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Check out repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Set up Python
              uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
              with:
                  python-version: "3.14"
                  cache: pip
                  cache-dependency-path: |
                      pyproject.toml
                      plugins/defaults/pyproject.toml
                      examples/plugin_adaptive_zlib/pyproject.toml

            - name: Install all distributions and test tools
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install -e ".[dev]" -e ./plugins/defaults -e ./examples/plugin_adaptive_zlib

            - name: Test runtime packaging
              run: python -m pytest -m distribution

            - name: Test defaults packaging
              run: python -m pytest -m distribution
              working-directory: plugins/defaults

            - name: Test adaptive packaging
              run: python -m pytest -m distribution
              working-directory: examples/plugin_adaptive_zlib
