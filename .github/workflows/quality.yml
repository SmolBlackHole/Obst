name: Quality

on:
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    quality:
        name: Python 3.14 on ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                os:
                    - ubuntu-latest
                    - windows-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Set up Python
              uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
              with:
                  python-version: "3.14"
                  cache: pip
                  cache-dependency-path: |
                      pyproject.toml
                      plugins/defaults/pyproject.toml

            - name: Install development dependencies
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install -e ".[dev]" -e ./plugins/defaults

            - name: Run repository quality checks
              run: python scripts/quality.py
